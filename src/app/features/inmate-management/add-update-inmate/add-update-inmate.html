<div class="page-container">
  <!-- Page Header -->
  <div class="page-header">
    <div>
      <h2>Add / Update Inmate</h2>
      <p class="breadcrumb">Home &gt; Inmate Management &gt; Add / Update Inmate</p>
    </div>
    <div class="header-right">
      <div class="step-indicator">
        Step <strong>{{ currentStep() }}</strong> of <strong>{{ totalSteps }}</strong>
      </div>
      <div class="header-user">
        <span class="user-role">Jail Admin</span>
        <span class="user-location">Central Jail</span>
      </div>
    </div>
  </div>

  <!-- Tabs -->
  <p-tabs [value]="activeTab()" (valueChange)="activeTab.set($event?.toString() ?? '0')">
    <p-tablist>
      <p-tab *ngFor="let step of steps; let i = index" [value]="i.toString()">
        <span class="tab-step-number">{{ i + 1 }}</span>
        <i [class]="step.icon"></i> {{ step.label }}
      </p-tab>
    </p-tablist>

    <p-tabpanels>
      <!-- Step 1: Inmate Details -->
      <p-tabpanel value="0">
        <app-inmate-details></app-inmate-details>
      </p-tabpanel>

      <!-- Step 2: Audio Contact -->
      <p-tabpanel value="1">
        <app-audio-contact></app-audio-contact>
      </p-tabpanel>

      <!-- Step 3: Video Contact -->
      <p-tabpanel value="2">
        <app-video-contact></app-video-contact>
      </p-tabpanel>

      <!-- Step 4: Approval Workflow -->
      <p-tabpanel value="3">
        <app-approval-workflow></app-approval-workflow>
      </p-tabpanel>

      <!-- Step 5: Wallet & Recharge -->
      <p-tabpanel value="4">
        <app-wallet-recharge></app-wallet-recharge>
      </p-tabpanel>

      <!-- Step 6: Activate Calling -->
      <p-tabpanel value="5">
        <app-activate-calling></app-activate-calling>
      </p-tabpanel>

      <!-- Step 7: Deactivate Calling -->
      <p-tabpanel value="6">
        <app-deactivate-calling></app-deactivate-calling>
      </p-tabpanel>
    </p-tabpanels>
  </p-tabs>

  <!-- Navigation & Submit Footer -->
  <div class="form-footer">
    <div class="footer-left">
      <p-button label="Previous" icon="pi pi-arrow-left" severity="secondary" [outlined]="true"
        (onClick)="prevStep()" [disabled]="isFirstStep()" />
    </div>
    <div class="footer-right">
      <p-button *ngIf="!isLastStep()" label="Next Step" icon="pi pi-arrow-right" iconPos="right"
        (onClick)="nextStep()" />
      <p-button *ngIf="isLastStep()" label="Submit All Details" icon="pi pi-check" severity="success"
        (onClick)="submitAll()" />
    </div>
  </div>

  <div class="security-note">
    <i class="pi pi-lock"></i> All documents are securely stored and transmissions are encrypted.
  </div>
</div>
