<div class="video-contact-card">
  <div class="section-header">
    <i class="pi pi-video section-icon"></i>

      <h3>3. Family Contact Details - Video Call</h3>
      <p>Add up to 3 App IDs</p>
    
  </div>

  <form class="form-wrapper">

    <!-- Top Fields -->
    <div class="grid form-grid">

      <div class="col-12 md:col-6">
        <div class="field">
          <label>Full Name <span>*</span></label>

          <input
            pInputText
            type="text"
            placeholder="Enter full name"
          />
        </div>
      </div>

      <div class="col-12 md:col-6">
        <div class="field">
          <label>Son / Daughter Of <span>*</span></label>

          <input
            pInputText
            type="text"
            placeholder="Enter father's / mother's name"
          />
        </div>
      </div>

      <div class="col-12">
        <div class="field">
          <label>Relation <span>*</span></label>

          <p-select
  [options]="relationOptions"
  optionLabel="label"
  optionValue="value"
  placeholder="Select relation"
  styleClass="w-full">
</p-select>
        </div>
      </div>

    </div>

    <!-- App IDs -->
    <div class="app-id-section">

      <div class="app-title">
        eNyay Path App IDs (For Video Call) <span>*</span>
      </div>

      <div class="app-subtitle">
        Add up to 3 App IDs
      </div>

      <div class="app-id-row" *ngFor="let item of [1,2,3]; let i = index">

        <div class="app-label">
          App ID {{ i + 1 }}
        </div>

        <div class="app-input">
          <input
            pInputText
            type="text"
            placeholder="Enter app id"
          />
        </div>

        <div class="registered-input">
          <label>Registered Name</label>

          <input
            pInputText
            type="text"
            placeholder="Enter registered name"
          />
        </div>

        <button
          pButton
          type="button"
          icon="pi pi-trash"
          class="p-button-text p-button-danger delete-btn">
        </button>

      </div>
    </div>

    <!-- Upload -->
    <div class="upload-section">

      <label>Aadhar Card <span>*</span></label>

      <div class="upload-row">

        <p-fileUpload
          mode="basic"
          chooseLabel="Upload Aadhar"
          chooseIcon="pi pi-upload"
          accept=".pdf,.jpg,.jpeg,.png"
          [auto]="false">
        </p-fileUpload>

        <small>PDF, JPG, PNG (Max. 2MB)</small>

      </div>
    </div>

  </form>
</div>
