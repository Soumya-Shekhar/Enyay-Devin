<div class="section-card">
  <h3 class="section-title">
    <span class="section-number">4</span>
    Approval Workflow <span class="section-subtitle">(Three Level Approval)</span>
  </h3>

  <form [formGroup]="form">
    <div class="approval-grid">
      <div class="approval-card">
        <div class="approval-header">
          <h4>Level 1: Jail Admin Approval</h4>
          <p-tag
            [value]="form.get('level1Status')?.value"
            [severity]="
              form.get('level1Status')?.value === 'Approved'
                ? 'success'
                : form.get('level1Status')?.value === 'Rejected'
                  ? 'danger'
                  : 'warn'
            "
          />
        </div>
        <div class="approval-connector">
          <div class="connector-line"></div>
          <span class="connector-arrow">&rarr;</span>
          <div class="connector-line"></div>
        </div>
        <div class="approval-body">
          <div class="form-field">
            <label>Admin Name</label>
            <input pInputText placeholder="Enter Admin name" />
          </div>
          <div class="form-field">
            <label>Remarks</label>
            <textarea
              pTextarea
              formControlName="level1Remarks"
              placeholder="Enter remarks (optional)"
              rows="3"
            ></textarea>
          </div>
        </div>
        <div class="approval-actions">
          <p-button
            label="Approve"
            icon="pi pi-check"
            severity="success"
            (onClick)="approveLevel(1)"
          />
          <p-button
            label="Reject"
            icon="pi pi-times"
            severity="danger"
            (onClick)="rejectLevel(1)"
          />
        </div>
      </div>

      <div class="approval-card">
        <div class="approval-header">
          <h4>Level 2: AS Approval</h4>
          <p-tag
            [value]="form.get('level2Status')?.value"
            [severity]="
              form.get('level2Status')?.value === 'Approved'
                ? 'success'
                : form.get('level2Status')?.value === 'Rejected'
                  ? 'danger'
                  : 'warn'
            "
          />
        </div>
        <div class="approval-body">
          <div class="form-field">
            <label>Forwarding Letter (As) <span class="required">*</span></label>
            <p-fileupload
              mode="basic"
              chooseLabel="Upload Forwarding Letter"
              accept=".pdf,.jpg,.png"
              [maxFileSize]="5242880"
              chooseIcon="pi pi-upload"
            />
            <small class="hint">PDF, JPG, PNG (Max. 5MB)</small>
          </div>
          <div class="form-field">
            <label>As Name</label>
            <input pInputText placeholder="Enter AS name" />
          </div>

          <div class="form-field">
            <label>Remarks</label>
            <textarea
              pTextarea
              formControlName="level2Remarks"
              placeholder="Enter remarks (optional)"
              rows="3"
            ></textarea>
          </div>
        </div>
        <div class="approval-actions">
          <p-button
            label="Approve"
            icon="pi pi-check"
            severity="success"
            (onClick)="approveLevel(2)"
          />
          <p-button
            label="Reject"
            icon="pi pi-times"
            severity="danger"
            (onClick)="rejectLevel(2)"
          />
        </div>
      </div>

      <div class="approval-card">
        <div class="approval-header">
          <h4>Level 3: DS Approval</h4>
          <p-tag
            [value]="form.get('level2Status')?.value"
            [severity]="
              form.get('level2Status')?.value === 'Approved'
                ? 'success'
                : form.get('level2Status')?.value === 'Rejected'
                  ? 'danger'
                  : 'warn'
            "
          />
        </div>
        <div class="approval-body">
          <div class="form-field">
            <label>Forwarding Letter (DS) <span class="required">*</span></label>
            <p-fileupload
              mode="basic"
              chooseLabel="Upload Forwarding Letter"
              accept=".pdf,.jpg,.png"
              [maxFileSize]="5242880"
              chooseIcon="pi pi-upload"
            />
            <small class="hint">PDF, JPG, PNG (Max. 5MB)</small>
          </div>
          <div class="form-field">
            <label>DS Name</label>
            <input pInputText placeholder="Enter DS name" />
          </div>
          <div class="form-field">
            <label>Remarks</label>
            <textarea
              pTextarea
              formControlName="level2Remarks"
              placeholder="Enter remarks (optional)"
              rows="3"
            ></textarea>
          </div>
        </div>
        <div class="approval-actions">
          <p-button
            label="Approve"
            icon="pi pi-check"
            severity="success"
            (onClick)="approveLevel(2)"
          />
          <p-button
            label="Reject"
            icon="pi pi-times"
            severity="danger"
            (onClick)="rejectLevel(2)"
          />
        </div>
      </div>

      <div class="final-status-card">
        <h4>Final Status</h4>
        <div class="status-icon">
          <i
            class="pi pi-check-circle"
            [class.approved]="form.get('finalStatus')?.value === 'Approved'"
          ></i>
        </div>
        <p class="status-text">{{ form.get('finalStatus')?.value }}</p>
        <small *ngIf="form.get('finalStatus')?.value === 'Waiting for approvals'">
          Once approved by Superintendent, calling feature will be enabled.
        </small>
      </div>
    </div>
  </form>

  <div class="component-footer">
    <p-button label="Save & Next" icon="pi pi-save" severity="success" (onClick)="save()" />
  </div>
</div>
