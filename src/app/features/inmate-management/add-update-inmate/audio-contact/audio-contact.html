<div class="section-card">
  <h3 class="section-title">
    <span class="section-number">2</span>
    Family Contact Details - Audio Call
  </h3>

  <div class="form-grid cols-2">
    <div class="form-field">
      <label>Full Name <span class="required">*</span></label>
      <input pInputText type="text" [(ngModel)]="audioContactData().fullName" placeholder="Enter full name" />
    </div>
    <div class="form-field">
      <label>Son / Daughter Of <span class="required">*</span></label>
      <input pInputText type="text" [(ngModel)]="audioContactData().sonDaughterOf" placeholder="Enter father's / mother's name" />
    </div>
    <div class="form-field">
      <label>Relation <span class="required">*</span></label>
      <p-select [options]="relationOptions" [(ngModel)]="audioContactData().relation"
        optionLabel="label" optionValue="value" placeholder="Select relation" styleClass="w-full" />
    </div>
    <div class="form-field">
      <label>Contact Number <span class="required">*</span></label>
      <p-inputgroup>
        <p-inputgroup-addon>+91</p-inputgroup-addon>
        <input pInputText type="text" [(ngModel)]="audioContactData().contactNumber" placeholder="Enter mobile number" />
      </p-inputgroup>
    </div>
  </div>

  <div class="form-grid cols-1" style="margin-top: 1rem;">
    <div class="form-field">
      <label>Aadhar Card <span class="required">*</span></label>
      <p-fileupload mode="basic" chooseLabel="Upload Aadhar" accept=".pdf,.jpg,.png"
        [maxFileSize]="2097152" chooseIcon="pi pi-upload" />
      <small class="hint">PDF, JPG, PNG (Max. 2MB)</small>
    </div>
    <div class="form-field">
      <label>SIM Owner Name Validation <span class="required">*</span></label>
      <div class="upload-row">
        <input pInputText type="text" [(ngModel)]="audioContactData().simOwnerName" placeholder="Enter SIM owner name" class="flex-input" />
        <p-button label="Validate" icon="pi pi-check" severity="success" (onClick)="validateSimOwner()" />
      </div>
    </div>
    <div class="form-field">
      <label>SIM Affidavit <span class="required">*</span></label>
      <p-fileupload mode="basic" chooseLabel="Upload SIM Affidavit" accept=".pdf,.jpg,.png"
        [maxFileSize]="2097152" chooseIcon="pi pi-upload" />
      <small class="hint">PDF, JPG, PNG (Max. 2MB)</small>
    </div>
  </div>

  

  <!-- Save Button -->
  <div class="component-footer">
    <p-button label="Save Audio Contact" icon="pi pi-save" severity="success" (onClick)="save()" />
  </div>
</div>
