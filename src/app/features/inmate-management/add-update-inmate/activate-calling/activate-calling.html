<div class="section-card">
  <h3 class="section-title">
    <span class="section-number">6</span>
    Activate Calling Feature <span class="section-subtitle">(After Approval)</span>
  </h3>

  <form [formGroup]="form">
    <div class="toggle-row">
      <div class="toggle-item">
        <span>Audio Calling</span>
        <p-toggleswitch formControlName="audioCalling" />
        <span class="toggle-label">{{ form.get('audioCalling')?.value ? 'Enable' : 'Disable' }}</span>
      </div>
      <div class="toggle-item">
        <span>Video Calling</span>
        <p-toggleswitch formControlName="videoCalling" />
        <span class="toggle-label">{{ form.get('videoCalling')?.value ? 'Enable' : 'Disable' }}</span>
      </div>
    </div>
  </form>

  <div class="component-footer">
    <p-button label="Save & Next" icon="pi pi-save" severity="success" (onClick)="save()" />
  </div>
</div>
