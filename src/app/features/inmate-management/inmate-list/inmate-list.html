<div class="page-container">
  <div class="page-header">
    <h2>Inmate List</h2>
    <p class="page-description">View and manage all registered inmates.</p>
  </div>

  <div class="table-card">
    <div class="table-toolbar">
      <input type="text" class="search-input" placeholder="Search inmates...">
      <button class="btn btn-primary" routerLink="/inmate-management/add-update">
        + Inmate & Family Management
      </button>
    </div>

    <div class="table-responsive">
      <table class="data-table">
        <thead>
          <tr>
            <th>Full Name</th>
            <th>Prison ID</th>
            <th>Jail No. / ID</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let inmate of inmates">
            <td>{{ inmate.fullName }}</td>
            <td>{{ inmate.prisonId }}</td>
            <td>{{ inmate.jailNo }}</td>
            <td class="actions-cell">
              <p-button icon="pi pi-pencil" severity="info" [text]="true" [rounded]="true"
                pTooltip="Edit" tooltipPosition="top" (onClick)="editInmate(inmate)" />
              <p-button icon="pi pi-eye" severity="secondary" [text]="true" [rounded]="true"
                pTooltip="View" tooltipPosition="top" />
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
