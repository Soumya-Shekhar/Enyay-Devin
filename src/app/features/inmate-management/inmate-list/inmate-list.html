<div class="page-container">
  <div class="page-header">
    <h2>Inmate List</h2>
    <p class="page-description">View and manage all registered inmates.</p>
  </div>

  <div class="table-card">
    <div class="table-toolbar">
      <input type="text" class="search-input" placeholder="Search inmates..." />
      <button class="btn btn-primary" routerLink="/inmate-management/add-update">
        + Add Inmate
      </button>
    </div>

    <div class="table-responsive">
      <table class="data-table">
        <thead>
          <tr>
            <th>Prison ID</th>
            <th>Full Name</th>
            <th>Status</th>
            <th>Admission Date</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let inmate of inmates">
            <td>{{ inmate.id }}</td>
            <td>{{ getFullName(inmate) }}</td>
            <td>
              <span
                class="status-badge"
                [ngClass]="{
                  'status-active': inmate.status === 'Active',
                  'status-released': inmate.status === 'Released',
                  'status-transferred': inmate.status === 'Transferred',
                }"
                >{{ inmate.status }}</span
              >
            </td>
            <td>{{ inmate.admissionDate }}</td>
            <td>
              <button class="btn-icon" title="Edit" (click)="editInmate(inmate)">
                <i class="pi pi-pencil"></i>
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
